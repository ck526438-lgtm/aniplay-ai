name: aniplay
description: "AniPlay AI — lecteur d'anime open-source avec skip intelligent des openings/endings."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0" # Color.withValues

dependencies:
  flutter:
    sdk: flutter

  # Lecture vidéo multiplateforme (libmpv) : Windows, Linux, macOS, Android, iOS
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Réseau & fichiers
  http: ^1.2.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
